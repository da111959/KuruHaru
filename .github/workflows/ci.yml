name: CI - Verify Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run ESLint Guardrails
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Check IPC Contracts
        run: npm run verify:protocol

      - name: Check Documentation and Config Template
        run: npm run docs:config
